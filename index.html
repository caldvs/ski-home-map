<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ski-home-map · pick a world</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛷</text></svg>">

<body class="dashboard">

<header class="dashboard-header">
  <h1>ski-home-map</h1>
  <p class="tagline">

    <a href="https://openskidata.org/">OpenSkiData</a>.

    Terrain by <a href="https://mapterhorn.com/">Mapterhorn</a> ·
    Pistes from <a href="https://openskidata.org/">OpenSkiData</a> ·
    Sun shadows by <a href="https://shademap.app/">ShadeMap</a>
  </p>
  <p class="muted">
    <a href="https://github.com/caldvs/ski-home-map">Source on GitHub</a>
